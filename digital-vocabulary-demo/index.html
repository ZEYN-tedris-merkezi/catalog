<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>ZEYN Digital Flipbook Demo</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#151515;color:#fff;overflow:hidden}.bar{height:60px;background:#0e0e0e;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 2px 14px #0008}.brand{position:absolute;left:18px;color:#5fd5f3;font-weight:800}.btn{width:44px;height:40px;border:0;border-radius:9px;background:#fff;color:#111;font-size:20px;font-weight:700;cursor:pointer}.cnt{background:#fff;color:#111;padding:10px 14px;border-radius:9px;font-weight:700;min-width:90px;text-align:center}.stage{height:calc(100% - 60px);display:flex;align-items:center;justify-content:center;padding:20px;perspective:1600px}.book{width:min(94vw,1100px);height:min(84vh,760px);display:flex;position:relative;filter:drop-shadow(0 22px 28px #000a)}.p{width:50%;height:100%;background:#fff;position:relative;overflow:hidden}.p.left{border-radius:8px 0 0 8px;box-shadow:inset -14px 0 22px #0002}.p.right{border-radius:0 8px 8px 0;box-shadow:inset 14px 0 22px #0002;transform-origin:left center}.p img{width:100%;height:100%;object-fit:contain;background:#fff}.wm{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;overflow:hidden}.wm span{transform:rotate(-28deg);font-size:clamp(18px,3vw,38px);font-weight:800;color:#0002;white-space:nowrap}.sp{position:absolute;left:50%;top:0;bottom:0;width:2px;background:#0004;z-index:4}.flip{animation:f .6s ease-in-out}@keyframes f{0%{transform:rotateY(0)}45%{transform:rotateY(-82deg);filter:brightness(.72)}100%{transform:rotateY(0)}}.note{position:absolute;bottom:8px;right:12px;color:#aaa;font-size:11px}@media(max-width:760px){.brand{display:none}.stage{padding:8px}.book{width:96vw;height:auto;aspect-ratio:.72}.left,.sp{display:none}.p.right{width:100%;border-radius:8px;transform-origin:center}.note{display:none}}</style></head><body><div class="bar"><div class="brand">ZEYN DIGITAL • FLIPBOOK DEMO</div><button class="btn" onclick="prev()">◀</button><div class="cnt" id="c">1 / 6</div><button class="btn" onclick="next()">▶</button><button class="btn" onclick="full()">⛶</button></div><div class="stage"><div class="book"><div class="p left" id="lp"><img id="li" src="page-01.jpg"><div class="wm"><span>DEMO • ZEYN DIGITAL</span></div></div><div class="p right" id="rp"><img id="ri" src="page-01.jpg"><div class="wm"><span>DEMO • ZEYN DIGITAL</span></div></div><div class="sp"></div></div></div><div class="note">Interaction demo: page-turn is active; full book pages will be connected in the protected sales version.</div><script>const total=6;let cur=0;const mob=()=>innerWidth<=760;function render(){const lp=document.getElementById('lp'),rp=document.getElementById('rp'),c=document.getElementById('c');if(mob()){lp.style.display='none';rp.style.width='100%';c.textContent=(cur+1)+' / '+total;return}lp.style.display='block';rp.style.width='50%';if(cur===0){lp.style.visibility='hidden';rp.style.visibility='visible';c.textContent='1 / '+total}else{lp.style.visibility='visible';let l=cur%2===1?cur:cur-1,r=l+1;rp.style.visibility=r<total?'visible':'hidden';c.textContent=(l+1)+(r<total?'–'+(r+1):'')+' / '+total}}function next(){const rp=document.getElementById('rp');rp.classList.remove('flip');void rp.offsetWidth;rp.classList.add('flip');if(mob())cur=Math.min(total-1,cur+1);else cur=cur===0?1:Math.min(total-1,cur+2);setTimeout(render,240)}function prev(){if(mob())cur=Math.max(0,cur-1);else cur=cur<=1?0:Math.max(1,cur-2);render()}function full(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}addEventListener('resize',render);addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev()});let x=0;addEventListener('touchstart',e=>x=e.touches[0].clientX,{passive:true});addEventListener('touchend',e=>{let d=e.changedTouches[0].clientX-x;if(d<-40)next();if(d>40)prev()},{passive:true});render();</script></body></html>
